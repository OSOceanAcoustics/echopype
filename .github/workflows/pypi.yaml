# Publish archives to PyPI and TestPyPI using GitHub Actions
name: Publish to PyPI

# Run on releases or manually
on:
  release:
    types:
      - released
  workflow_dispatch:

jobs:
  build-artifact:
    name: Build echopype package
    runs-on: ubuntu-latest
    if: github.repository == 'echostack-org/echopype' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # fetch all history so that setuptools-scm works
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.13

    - name: Install build frontend
      run: python -m pip install --upgrade pip build twine

    - name: Build source and wheel distributions
      run: |
        python -m build
        python -m twine check dist/*
        echo ""
        echo "Generated files:"
        ls -lh dist/
    - uses: actions/upload-artifact@v7
      with:
        name: releases
        path: dist

  test-built-dist:
    name: Test echopype package
    needs: build-artifact
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v7.0.0
      name: Install Python
      with:
        python-version: 3.13
    - uses: actions/download-artifact@v8
      with:
        name: releases
        path: dist
    - name: List contents of built dist
      run: |
        ls -ltrh
        ls -ltrh dist
    - name: Check built wheel in a fresh environment
      run: |
        python -m venv "$RUNNER_TEMP/test-wheel"
        "$RUNNER_TEMP/test-wheel/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/test-wheel/bin/python" -m pip install dist/*.whl
        "$RUNNER_TEMP/test-wheel/bin/python" -c "import echopype; print(echopype.__version__)"
        if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
          EXPECTED="${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/test-wheel/bin/python" -c 'import os, importlib.metadata; assert importlib.metadata.version("echopype") == os.environ["EXPECTED"]'
        fi

    - name: Check built source distribution in a fresh environment
      run: |
        python -m venv "$RUNNER_TEMP/test-source"
        "$RUNNER_TEMP/test-source/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/test-source/bin/python" -m pip install dist/*.tar.gz
        "$RUNNER_TEMP/test-source/bin/python" -c "import echopype; print(echopype.__version__)"
        if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
          EXPECTED="${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/test-source/bin/python" -c 'import os, importlib.metadata; assert importlib.metadata.version("echopype") == os.environ["EXPECTED"]'
        fi

    - name: Publish to Test PyPI
      if: github.event_name == 'release' && github.event.action == 'released'
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        verbose: true
        skip-existing: true

  publish-pypi:
    name: Push echopype to production pypi
    needs: test-built-dist
    if: github.event_name == 'release' && github.event.action == 'released' && github.repository == 'echostack-org/echopype'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: releases
        path: dist
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
