# Manually verify an already-published conda-forge echopype release.
name: Test conda-forge release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published echopype version to test (for example 0.12.0)'
        required: true
        type: string

jobs:
  test-conda-install:
    name: Install echopype (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.13', '3.14']
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: latest
          auto-activate-base: false

      - name: Install published package from conda-forge
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          conda create --yes --name echopype-release-test \
            --override-channels --channel conda-forge \
            "python=$PYTHON_VERSION" "echopype=$RELEASE_VERSION"

      - name: Verify installed package version and import
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          conda run --name echopype-release-test python -c \
            'import os, importlib.metadata, echopype; expected=os.environ["RELEASE_VERSION"]; actual=importlib.metadata.version("echopype"); print("Installed echopype:", actual); assert actual == expected, (actual, expected)'
