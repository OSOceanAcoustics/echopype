name: Update dependency versions to meet SPEC 0

on:
  schedule:
    # Day 3 of each quarter, after the quarterly SPEC 0 update
    - cron: "0 0 3 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: scientific-python/spec0-action@1dd0542907c81856ac19ff52fa715db1850797cf # v1.5
        with:
          update_all: 2
