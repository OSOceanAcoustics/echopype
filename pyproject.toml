[build-system]
requires = [
    "setuptools >= 68",
    "setuptools_scm[toml] >= 8.0",
    "wheel >= 0.29.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "echopype"
description = "Enhancing the interoperability and scalability in analyzing ocean sonar data"
readme = "README.md"
requires-python = ">=3.12, <3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Wu-Jung Lee", email = "leewujung@gmail.com" },
]
maintainers = [
    { name = "Wu-Jung Lee", email = "leewujung@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
dependencies = [
    "aiohttp>=3.10.0",
    "bottleneck>=1.4.1",
    "dask[array,distributed]>=2024.8.0",
    "dask-image>=2025.11.0",
    "flox>=0.9.9",
    "fsspec>=2024.9.0",
    "geopy>=2.5.0",
    "jinja2>=3.1.5",
    "netCDF4>=1.7.1.post2",
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "psutil>=6.1.0",
    "pynmea2",
    "pytz>=2024.2",
    "requests>=2.32.4",
    "s3fs>=2024.9.0",
    "scipy>=1.15.0",
    "typing-extensions>=4.13.0",
    "xarray>=2026.01.0",
    "zarr>=3",
]

[project.urls]
Homepage = "https://github.com/echostack-org/echopype"
Repository = "https://github.com/echostack-org/echopype"
Documentation = "https://echopype.readthedocs.io"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.10.0",
    "cmocean",
]

[dependency-groups]
test = [
    "moto>=5.0.12",
    "pooch>=1.9.0",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.1",
    "pytest-xdist>=3.7.0",
    "matplotlib>=3.10.0",
]

docs = [
    "jupyter-book>=1.0.3",
    "linkify-it-py>=2.1.0",
    "myst-nb>=1.1.2",
    "numpydoc>=1.8.0",
    "sphinx>=8.0.0",
    "sphinx-automodapi>=0.18.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx-external-toc>=1.1.0",
    "sphinx-jupyterbook-latex",
    "sphinx-panels",
    "sphinx-thebe",
    "sphinx-togglebutton>=0.4.4",
    "sphinxcontrib-bibtex>=2.6.3",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinx-inline-tabs>=2025.12.21.14",
]

dev = [
    "black>=24.8.0",
    "check-manifest>=0.50",
    "codespell>=2.4.0",
    "ipykernel>=6.30.0",
    "isort>=6.0.0",
    "mypy>=1.11.1",
    "pre-commit>=4.0.0",
    "pylint>=3.2.7",
    "ruff>=0.5.6",
    "setuptools_scm>=8.2.0",
    "twine>=6.0.0",
    "wheel>=0.44.0",
]

[tool.setuptools]
include-package-data = true
py-modules = ["_echopype_version"]

[tool.setuptools.packages.find]
include = ["echopype*"]

[tool.setuptools_scm]
fallback_version = "0.0"
local_scheme = "node-and-date"
version_file = "_echopype_version.py"
version_file_template = 'version = "{version}"  # noqa'

[tool.pytest.ini_options]
testpaths = ["echopype/tests"]
cache_dir = ".cache"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

# Show each distinct warning once during the pytest session.
filterwarnings = [
    "once",
]

[tool.uv]
exclude-newer = "7 days"
default-groups = ["dev", "test"]

[tool.black]
line-length = 100

[tool.isort]
known_first_party = "echopype"
known_third_party = ["_echopype_version", "setuptools"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E722",
    "E203",
]

[tool.ruff.lint.isort]
known-first-party = ["echopype"]
combine-as-imports = true
